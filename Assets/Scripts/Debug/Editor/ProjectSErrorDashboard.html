<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ProjectS Error Review</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, "Noto Sans KR", system-ui, sans-serif; background: #111217; color: #e6e8ef; }
    * { box-sizing: border-box; } body { margin: 0; min-width: 760px; background: radial-gradient(circle at 70% -30%, #2b2344, transparent 37rem), #111217; }
    header { padding: 24px 28px 18px; border-bottom: 1px solid #2a2d38; display: flex; justify-content: space-between; gap: 24px; align-items: start; }
    h1 { margin: 0 0 5px; font-size: 21px; letter-spacing: -.02em; } h2 { font-size: 14px; margin: 0 0 11px; }
    .sub, .meta { color: #a9afbd; font-size: 12px; } .status { text-align: right; font-size: 12px; line-height: 1.65; color: #a9afbd; }
    .ok { color: #73d6a0; } .warn { color: #ffd076; } .error { color: #ff9696; }
    main { display: grid; grid-template-columns: minmax(440px, 1.15fr) minmax(320px, .85fr); min-height: calc(100vh - 100px); }
    section { padding: 20px 24px; min-width: 0; } #inspector { background: rgba(18, 20, 27, .7); border-left: 1px solid #2a2d38; }
    .toolbar { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; }
    input[type="search"], select { background: #1c1f28; border: 1px solid #383c49; color: inherit; border-radius: 7px; padding: 8px 10px; font: inherit; font-size: 12px; }
    input[type="search"] { flex: 1; min-width: 140px; } button { background: #6851c7; color: white; border: 0; border-radius: 7px; padding: 8px 11px; font: inherit; font-size: 12px; cursor: pointer; }
    button:hover { background: #7a63dc; } button.secondary { background: #292d39; color: #d9dce5; }
    .count { color: #9ca3b6; font-size: 12px; margin: 3px 0 10px; } .empty { padding: 32px 12px; color: #9ca3b6; line-height: 1.65; }
    .row { display: grid; grid-template-columns: 22px minmax(0, 1fr) 90px; gap: 8px; padding: 10px; border: 1px solid #2d303b; border-radius: 8px; margin: 7px 0; cursor: pointer; background: rgba(31, 34, 44, .52); }
    .row:hover, .row.active { border-color: #7460c9; background: #242333; } .row input { margin-top: 3px; } .message { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
    .type { font-size: 11px; color: #ff9696; margin-bottom: 3px; } .summary { color: #9ca3b6; font-size: 11px; margin-top: 5px; }.hits { text-align: right; color: #a9afbd; font-size: 11px; padding-top: 4px; }.hits b { color: #e6e8ef; font-size: 14px; }
    .detail-message { color: #ffb5b5; font-size: 13px; line-height: 1.55; white-space: pre-wrap; margin: 0 0 14px; }.stack { margin: 0; padding: 13px; background: #0c0d11; border: 1px solid #272a34; border-radius: 7px; color: #c8cdd9; white-space: pre-wrap; overflow-wrap: anywhere; font: 11px/1.6 ui-monospace, Consolas, monospace; max-height: calc(100vh - 250px); overflow: auto; }
    .selection-bar { display: flex; justify-content: space-between; gap: 8px; align-items: center; margin: 14px 0 0; }.saved { color: #73d6a0; font-size: 12px; min-height: 18px; }
  </style>
</head>
<body>
  <header>
    <div><h1>ProjectS Error Review</h1><div class="sub">Unity Editor가 열려 있는 동안 자동 갱신됩니다. Error · Exception만 표시합니다.</div></div>
    <div class="status" id="status">수집기 확인 중…</div>
  </header>
  <main>
    <section>
      <div class="toolbar"><input id="search" type="search" placeholder="메시지 또는 스택트레이스 검색"><select id="type"><option value="">전체 유형</option><option>Error</option><option>Exception</option></select><button class="secondary" id="refresh">새로고침</button></div>
      <div class="count" id="count"></div><div id="errors"></div>
      <div class="selection-bar"><button class="secondary" id="clear">선택 해제</button><div class="saved" id="saved"></div><button id="save">분석 대상으로 고정</button></div>
    </section>
    <section id="inspector"><h2>원본 스택트레이스</h2><div id="detail" class="empty">왼쪽 항목을 선택하면 메시지와 전체 스택트레이스가 표시됩니다.</div></section>
  </main>
  <script>
    const state = { errors: [], selected: new Set(), active: null, limit: 100 };
    const byId = id => state.errors.find(error => error.id === id);
    const html = value => String(value ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('"', '&quot;');
    function grouped() {
      const query = document.querySelector('#search').value.trim().toLowerCase();
      const type = document.querySelector('#type').value; const map = new Map();
      for (const error of state.errors) {
        if (type && error.logType !== type) continue;
        if (query && !`${error.message}\n${error.stackTrace}`.toLowerCase().includes(query)) continue;
        const key = `${error.logType}\u0000${error.message}`;
        if (!map.has(key)) map.set(key, { ...error, ids: [] }); map.get(key).ids.push(error.id);
      }
      return [...map.values()].reverse();
    }
    function render() {
      const target = document.querySelector('#errors'); target.replaceChildren(); const visible = grouped();
      document.querySelector('#count').textContent = `${state.errors.length}개 수집 · ${visible.length}개 메시지 묶음 · ${state.selected.size}개 선택됨`;
      if (!visible.length) { target.innerHTML = '<div class="empty">아직 표시할 오류가 없습니다. Unity를 플레이한 뒤 오류가 발생하면 자동으로 갱신됩니다.</div>'; return; }
      for (const group of visible) {
        const row = document.createElement('label'); row.className = `row${state.active === group.id ? ' active' : ''}`;
        const checkbox = document.createElement('input'); checkbox.type = 'checkbox'; const count = group.ids.filter(id => state.selected.has(id)).length;
        checkbox.checked = count === group.ids.length; checkbox.indeterminate = count > 0 && !checkbox.checked; checkbox.addEventListener('click', event => event.stopPropagation());
        checkbox.addEventListener('change', () => { for (const id of group.ids) checkbox.checked ? state.selected.add(id) : state.selected.delete(id); render(); });
        const content = document.createElement('div'); content.innerHTML = `<div class="type">${html(group.logType)} · ${html(group.source)} / ${html(group.category)}</div><div class="message" title="${html(group.message)}">${html(group.message)}</div><div class="summary">최근: ${html(group.capturedAtUtc)}</div>`;
        const hits = document.createElement('div'); hits.className = 'hits'; hits.innerHTML = `<b>${group.ids.length}</b><br>발생`;
        row.append(checkbox, content, hits); row.addEventListener('click', event => { if (event.target !== checkbox) show(group.id); }); target.append(row);
      }
    }
    function show(id) { state.active = id; const error = byId(id); const detail = document.querySelector('#detail'); detail.replaceChildren(); if (!error) return; const message = document.createElement('div'); message.className = 'detail-message'; message.textContent = `${error.logType}: ${error.message}`; const stack = document.createElement('pre'); stack.className = 'stack'; stack.textContent = error.stackTrace || '(Unity가 스택트레이스를 제공하지 않았습니다.)'; detail.append(message, stack); render(); }
    function setStatus(payload) { const session = payload.session || {}; const detail = session.fileName ? `세션: ${session.fileName}` : 'Unity 플레이 세션을 기다리는 중'; document.querySelector('#status').innerHTML = `<span class="${payload.inboxAvailable ? 'ok' : 'warn'}">${payload.inboxAvailable ? '수집기 연결됨' : '수집 파일 없음'}</span><br>${html(detail)}`; }
    async function load() { try { const response = await fetch('/api/errors', { cache: 'no-store' }); if (!response.ok) throw new Error(); const payload = await response.json(); state.errors = payload.errors || []; state.selected = new Set((payload.selectedIds || []).filter(id => state.errors.some(error => error.id === id))); state.limit = payload.selectionLimit || 100; setStatus(payload); render(); } catch { document.querySelector('#status').innerHTML = '<span class="error">Unity Editor 대시보드에 연결할 수 없습니다.</span>'; } }
    async function save() { const response = await fetch('/api/selection', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ids: [...state.selected].slice(0, state.limit) }) }); if (!response.ok) throw new Error(); const payload = await response.json(); state.selected = new Set(payload.ids || []); document.querySelector('#saved').textContent = `${state.selected.size}개 항목을 분석 대상으로 고정했습니다.`; render(); }
    document.querySelector('#search').addEventListener('input', render); document.querySelector('#type').addEventListener('change', render); document.querySelector('#refresh').addEventListener('click', load); document.querySelector('#clear').addEventListener('click', () => { state.selected.clear(); render(); }); document.querySelector('#save').addEventListener('click', () => save().catch(load)); load(); setInterval(load, 2500);
  </script>
</body>
</html>
